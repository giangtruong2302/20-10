<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gửi Ánh Như 20/10</title>
<meta name="description" content="Chúc mừng ngày Phụ nữ Việt Nam 20/10 – gửi Hoàng Nguyễn Ánh Như">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  :root {
    --bg1: #2a0b2e;
    --bg2: #5c1440;
    --pink: #ff8fb8;
    --rose: #e8335f;
    --gold: #ffd479;
    --text: #fff3f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 20%, var(--bg2) 0%, var(--bg1) 70%) fixed, var(--bg1);
  }

  /* ---------- trời sao ---------- */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: #fff; opacity: .2; animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 50% { opacity: 1; transform: scale(1.6); } }

  /* ---------- cánh hoa rơi ---------- */
  .petal {
    position: fixed; top: -40px; z-index: 1; pointer-events: none;
    width: 14px; height: 18px;
    background: linear-gradient(135deg, #ffc2d6, var(--pink));
    border-radius: 80% 0 80% 0;
    opacity: .85;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); }
  }

  /* ---------- màn mở quà ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    padding: 16px; text-align: center;
    transition: opacity .9s ease, visibility .9s;
  }
  #intro.hide { opacity: 0; visibility: hidden; }
  #intro h2 { font-family: "Dancing Script", cursive; font-size: clamp(28px, 7vw, 46px); color: var(--pink); }
  .gift {
    font-size: 88px; cursor: pointer; border: none; background: none;
    animation: bounce 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(255, 143, 184, .6));
  }
  @keyframes bounce { 50% { transform: translateY(-14px) rotate(-4deg); } }
  #intro p { opacity: .8; font-size: 15px; }

  /* ---------- nội dung chính ---------- */
  main {
    position: relative; z-index: 2;
    min-height: 100vh; max-width: 1000px; margin: 0 auto;
    padding: 32px 16px 48px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px 48px;
    opacity: 0; transition: opacity 1s ease;
  }
  main.show { opacity: 1; }

  .bouquet-wrap { width: min(360px, 88vw); }
  .bouquet-wrap svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 12px 30px rgba(0,0,0,.35)); }

  .card { width: min(440px, 100%); text-align: center; }
  .card .date {
    font-family: "Dancing Script", cursive; font-size: clamp(22px, 5vw, 30px); color: var(--gold);
    opacity: 0; transform: translateY(16px); transition: all .8s ease;
  }
  .card h1 {
    font-family: "Dancing Script", cursive; font-weight: 700;
    font-size: clamp(38px, 9vw, 60px); line-height: 1.15; margin: 6px 0 18px;
    background: linear-gradient(90deg, #ffd1e1, var(--pink), var(--gold), var(--pink), #ffd1e1);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 4s linear infinite;
    opacity: 0; transform: scale(.85); transition: opacity 1s ease, transform 1s ease;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .card .msg {
    min-height: 9em; font-size: clamp(16px, 3.8vw, 18px); line-height: 1.75;
    white-space: pre-line;
  }
  .card .msg .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--pink); vertical-align: -3px; animation: blink .8s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .card .sign {
    margin-top: 18px; font-family: "Dancing Script", cursive; font-size: 26px; color: var(--pink);
    opacity: 0; transition: opacity 1s ease;
  }
  .card .hint { margin-top: 18px; font-size: 13px; opacity: 0; transition: opacity 1s ease 1s; }
  .in { opacity: 1 !important; transform: none !important; }

  /* ---------- hoạt ảnh bó hoa ---------- */
  .stem {
    fill: none; stroke: #3f9a4c; stroke-width: 4; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  .leaf { fill: #4fb35e; opacity: 0; transform: scale(0); }
  .bloom { transform: scale(0) rotate(-90deg); opacity: 0; }
  .filler { opacity: 0; transform: scale(0); }
  .bow { opacity: 0; transform: scale(0); }
  .paper { opacity: 0; transform: translateY(30px); }

  .play .stem { animation: draw 1.4s ease-out forwards; animation-delay: var(--d); }
  .play .leaf { animation: pop .6s ease-out forwards; animation-delay: var(--d); }
  .play .bloom { animation: bloom 1.1s cubic-bezier(.3,1.6,.5,1) forwards, sway 4s ease-in-out infinite; animation-delay: var(--d), calc(var(--d) + 1.1s); }
  .play .filler { animation: pop .5s ease-out forwards; animation-delay: var(--d); }
  .play .paper { animation: rise .9s ease-out forwards; animation-delay: var(--d); }
  .play .bow { animation: pop .7s cubic-bezier(.3,1.8,.5,1) forwards; animation-delay: var(--d); }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes bloom { to { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

  /* ---------- tim khi chạm ---------- */
  .heart {
    position: fixed; z-index: 20; pointer-events: none; font-size: 22px;
    animation: floatUp 1.6s ease-out forwards;
  }
  @keyframes floatUp {
    to { transform: translate(var(--dx), -140px) scale(1.4); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .petal, .star, .gift { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <section id="intro">
    <h2>Có một món quà dành cho em</h2>
    <button class="gift" id="openGift" aria-label="Mở quà">🎁</button>
    <p>Chạm vào hộp quà để mở nhé 💕</p>
  </section>

  <main id="main">
    <div class="bouquet-wrap">
      <svg id="bouquet" viewBox="0 0 400 520" aria-label="Bó hoa tặng em"></svg>
    </div>
    <div class="card">
      <div class="date" id="date">Chúc mừng ngày 20 tháng 10</div>
      <h1 id="name">Hoàng Nguyễn<br>Ánh Như</h1>
      <div class="msg" id="msg"></div>
      <div class="sign" id="sign">Anh yêu em thật nhiều ❤</div>
      <div class="hint" id="hint">(chạm vào màn hình để thả tim nhé)</div>
    </div>
  </main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const MESSAGE =
    "Gửi Ánh Như – cô gái đáng yêu nhất,\n" +
    "Nhân ngày Phụ nữ Việt Nam 20/10, chúc em luôn xinh đẹp, rạng rỡ như những đóa hoa này. " +
    "Mong mỗi ngày của em đều ngập tràn niềm vui, tiếng cười và thật nhiều sức khỏe. " +
    "Cảm ơn em vì đã xuất hiện và làm mọi ngày trở nên ngọt ngào hơn. 🌸\n" +
    "Và nhớ ôm và hôn anh thật nhiều nhé! 🤗😘";

  /* ---------- sao ---------- */
  const stars = document.getElementById("stars");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 3 + "s";
    stars.appendChild(s);
  }

  /* ---------- cánh hoa rơi ---------- */
  function spawnPetal() {
    const p = document.createElement("div");
    p.className = "petal";
    const size = 10 + Math.random() * 10;
    p.style.width = size + "px";
    p.style.height = size * 1.3 + "px";
    p.style.left = Math.random() * 100 + "vw";
    p.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
    p.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    p.style.animationDuration = 6 + Math.random() * 6 + "s";
    if (Math.random() < .3) p.style.background = "linear-gradient(135deg,#fff,#ffd6e5)";
    document.body.appendChild(p);
    p.addEventListener("animationend", () => p.remove());
  }

  /* ---------- dựng bó hoa bằng SVG ---------- */
  const svg = document.getElementById("bouquet");
  const el = (tag, attrs = {}, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  };

  const defs = el("defs");
  defs.innerHTML = `
    <linearGradient id="paperBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3ec"/><stop offset="1" stop-color="#f3b9cf"/>
    </linearGradient>
    <linearGradient id="paperFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c6d8"/><stop offset=".5" stop-color="#fde8f0"/><stop offset="1" stop-color="#eaa6c1"/>
    </linearGradient>
    <radialGradient id="roseRed"><stop offset="0" stop-color="#8e0f30"/><stop offset="1" stop-color="#e8335f"/></radialGradient>
    <radialGradient id="rosePink"><stop offset="0" stop-color="#d64b80"/><stop offset="1" stop-color="#ffa3c4"/></radialGradient>
    <radialGradient id="tulip" cx=".5" cy=".2"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9a5a"/></radialGradient>`;

  const BASE = { x: 200, y: 430 };

  // giấy gói phía sau
  el("path", { class: "paper", d: "M70 210 Q200 150 330 210 L215 470 L185 470 Z", fill: "url(#paperBack)", style: "--d:.1s" });

  const flowers = [
    { x: 200, y: 112, type: "rose",  fill: "url(#roseRed)",  r: 34, d: 1.6 },
    { x: 128, y: 160, type: "rose",  fill: "url(#rosePink)", r: 30, d: 1.9 },
    { x: 272, y: 160, type: "rose",  fill: "url(#rosePink)", r: 30, d: 2.0 },
    { x: 92,  y: 238, type: "daisy", r: 26, d: 2.3 },
    { x: 308, y: 238, type: "daisy", r: 26, d: 2.4 },
    { x: 162, y: 214, type: "tulip", r: 24, d: 2.6 },
    { x: 240, y: 216, type: "rose",  fill: "url(#roseRed)",  r: 28, d: 2.7 },
    { x: 200, y: 262, type: "daisy", r: 24, d: 2.9 },
  ];

  const stemLayer = el("g");
  const leafLayer = el("g");
  const fillerLayer = el("g");
  const flowerLayer = el("g");

  flowers.forEach((f, i) => {
    const cx = (BASE.x + f.x) / 2 + (f.x < BASE.x ? -15 : 15);
    const cy = (BASE.y + f.y) / 2;
    el("path", {
      class: "stem", pathLength: 1, style: `--d:${(.3 + i * .08).toFixed(2)}s`,
      d: `M${BASE.x} ${BASE.y} Q${cx} ${cy} ${f.x} ${f.y}`
    }, stemLayer);

    // lá
    const lx = (BASE.x + f.x) / 2, ly = (BASE.y + f.y) / 2 + 20;
    const lg = el("g", { transform: `translate(${lx} ${ly}) rotate(${f.x < 200 ? -40 : 40})` }, leafLayer);
    el("path", { class: "leaf", d: "M0 0 Q14 -20 0 -40 Q-14 -20 0 0Z", style: `--d:${1.2 + i * .07}s` }, lg);

    // hoa
    const g = el("g", { transform: `translate(${f.x} ${f.y})` }, flowerLayer);
    const b = el("g", { class: "bloom", style: `--d:${f.d}s` }, g);
    drawFlower(b, f);
  });

  // hoa baby trắng xen kẽ
  const fillerSpots = [[160,120],[240,118],[100,200],[300,200],[150,262],[252,262],[200,190],[124,108],[278,110],[60,190],[340,192]];
  fillerSpots.forEach(([x, y], i) => {
    const outer = el("g", { transform: `translate(${x} ${y})` }, fillerLayer);
    const g = el("g", { class: "filler", style: `--d:${3 + i * .08}s` }, outer);
    for (let k = 0; k < 5; k++) {
      const a = Math.random() * Math.PI * 2, d = Math.random() * 10;
      el("circle", { cx: Math.cos(a) * d, cy: Math.sin(a) * d, r: 2.4 + Math.random() * 1.5, fill: "#fff" }, g);
    }
  });

  // giấy gói phía trước
  el("path", { class: "paper", d: "M105 285 Q200 330 295 285 L218 478 L182 478 Z", fill: "url(#paperFront)", style: "--d:.2s" });
  el("path", { class: "paper", d: "M105 285 Q200 330 295 285", fill: "none", stroke: "#e58bb0", "stroke-width": 2, style: "--d:.2s" });

  // nơ
  const bow = el("g", { transform: "translate(200 400)" });
  const bi = el("g", { class: "bow", style: "--d:3.4s" }, bow);
  bi.innerHTML = `
    <path d="M0 0 C-30 -30 -60 -10 -52 10 C-46 24 -20 14 0 0Z" fill="#e8335f"/>
    <path d="M0 0 C30 -30 60 -10 52 10 C46 24 20 14 0 0Z" fill="#e8335f"/>
    <path d="M-4 4 L-22 54 L-10 48 L-4 58 Z" fill="#c4204a"/>
    <path d="M4 4 L22 54 L10 48 L4 58 Z" fill="#c4204a"/>
    <circle r="9" fill="#ff5c86"/>`;

  function drawFlower(g, f) {
    if (f.type === "rose") {
      for (let i = 0; i < 8; i++)
        el("ellipse", { rx: f.r * .55, ry: f.r * .38, cx: f.r * .45, fill: f.fill, transform: `rotate(${i * 45})`, opacity: .95 }, g);
      for (let i = 0; i < 6; i++)
        el("ellipse", { rx: f.r * .38, ry: f.r * .27, cx: f.r * .25, fill: f.fill, transform: `rotate(${i * 60 + 20})`, stroke: "rgba(0,0,0,.15)" }, g);
      el("path", {
        d: `M0 0 m-${f.r * .2} 0 a${f.r * .2} ${f.r * .2} 0 1 1 ${f.r * .4} 0 a${f.r * .14} ${f.r * .14} 0 1 1 -${f.r * .28} 0`,
        fill: "none", stroke: "rgba(80,0,20,.5)", "stroke-width": 2
      }, g);
    } else if (f.type === "daisy") {
      for (let i = 0; i < 14; i++)
        el("ellipse", { rx: f.r * .55, ry: f.r * .16, cx: f.r * .55, fill: "#fffdf8", stroke: "#f2dbe4", transform: `rotate(${i * (360 / 14)})` }, g);
      el("circle", { r: f.r * .3, fill: "#ffc93c" }, g);
      el("circle", { r: f.r * .16, fill: "#f0a020" }, g);
    } else {
      el("path", { d: `M-${f.r * .8} -${f.r * .2} Q-${f.r * .9} ${f.r} 0 ${f.r} Q${f.r * .9} ${f.r} ${f.r * .8} -${f.r * .2} L${f.r * .45} ${f.r * .1} L0 -${f.r * .7} L-${f.r * .45} ${f.r * .1} Z`, fill: "url(#tulip)" }, g);
      el("path", { d: `M0 -${f.r * .7} Q-${f.r * .3} ${f.r * .3} 0 ${f.r} Q${f.r * .3} ${f.r * .3} 0 -${f.r * .7}`, fill: "#ffb36b", opacity: .8 }, g);
    }
  }

  /* ---------- gõ chữ ---------- */
  function typeMessage(text, target, done) {
    let i = 0;
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    const chars = Array.from(text);
    (function tick() {
      target.textContent = chars.slice(0, i).join("");
      target.appendChild(cursor);
      if (i++ < chars.length) setTimeout(tick, chars[i - 1] === "\n" ? 400 : 45);
      else { cursor.remove(); done && done(); }
    })();
  }

  /* ---------- thả tim ---------- */
  const HEARTS = ["❤️", "💖", "💕", "🌸", "💗", "🌹"];
  function burst(x, y) {
    for (let i = 0; i < 6; i++) {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = HEARTS[Math.floor(Math.random() * HEARTS.length)];
      h.style.left = x - 11 + "px";
      h.style.top = y - 11 + "px";
      h.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      h.style.animationDelay = i * 60 + "ms";
      document.body.appendChild(h);
      h.addEventListener("animationend", () => h.remove());
    }
  }

  /* ---------- mở quà ---------- */
  let opened = false;
  document.getElementById("openGift").addEventListener("click", (e) => {
    if (opened) return;
    opened = true;
    burst(e.clientX, e.clientY);
    document.getElementById("intro").classList.add("hide");
    document.getElementById("main").classList.add("show");
    svg.classList.add("play");
    setInterval(spawnPetal, 350);

    setTimeout(() => document.getElementById("date").classList.add("in"), 1200);
    setTimeout(() => document.getElementById("name").classList.add("in"), 2000);
    setTimeout(() => typeMessage(MESSAGE, document.getElementById("msg"), () => {
      document.getElementById("sign").classList.add("in");
      document.getElementById("hint").classList.add("in");
    }), 3600);
  });

  document.addEventListener("pointerdown", (e) => { if (opened) burst(e.clientX, e.clientY); });
})();
</script>
</body>
</html>
